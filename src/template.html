<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14062e">
<title>GTB Bommel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:Inter,system-ui,sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
canvas{display:block;position:fixed;inset:0}
button{font-family:inherit}
:root{--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
/* ---------- intro: artwork-slides + logo + laadbalk ---------- */
#intro{position:fixed;inset:0;z-index:30;background:#0b0418;overflow:hidden}
.slide{position:absolute;inset:0;overflow:hidden;transform:translateX(100%);transition:transform 1.1s cubic-bezier(.7,0,.2,1)}
.slideImg{position:absolute;inset:0;background-size:cover;background-position:center 35%;animation:kb 9s ease-out both}.slideBg{display:none}
@keyframes kb{from{transform:scale(1.08)}to{transform:scale(1)}}
.slide.on{transform:translateX(0)}.slide.off{transform:translateX(-100%)}
.slide::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,4,24,.55) 0%,rgba(10,4,24,0) 30%,rgba(10,4,24,0) 55%,rgba(10,4,24,.85) 100%)}
@media (min-aspect-ratio:1/1){.slideImg{background-size:auto 100%;background-repeat:no-repeat;background-position:center}.slideBg{display:block;position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(30px) brightness(.55)}}
#introLogo{position:absolute;left:50%;top:calc(var(--st) + 5vh);transform:translateX(-50%);width:min(78vw,460px);z-index:3;filter:drop-shadow(0 6px 18px rgba(0,0,0,.55));animation:pop .9s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
#loadBox{position:absolute;left:calc(var(--sl) + 22px);right:calc(var(--sr) + 22px);bottom:calc(var(--sb) + 28px);z-index:3;transition:opacity .5s}
#loadTip{font:600 13px Inter,sans-serif;color:#f3e9ff;margin-bottom:10px;text-shadow:0 1px 4px #000;min-height:18px}
#loadRow{display:flex;align-items:center;gap:12px}
#loadBar{flex:1;height:4px;background:rgba(255,255,255,.18);border-radius:2px;overflow:hidden}
#loadFill{height:100%;width:0;background:linear-gradient(90deg,#ff2e88,#ff8a3d,#ffd166);box-shadow:0 0 10px #ff2e88}
#loadPct{font:800 12px Inter,sans-serif;letter-spacing:2px;min-width:44px;text-align:right}
#loadSpin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#play{position:absolute;left:50%;bottom:calc(var(--sb) + 34px);transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:4;font:400 30px Anton,Impact,sans-serif;letter-spacing:4px;padding:14px 64px;border:0;border-radius:44px;color:#1a0629;background:linear-gradient(90deg,#ffd166,#ff8a3d,#ff2e88);box-shadow:0 0 34px rgba(255,46,136,.7);transition:opacity .6s,transform .6s}
#play.show{opacity:1;transform:translate(-50%,0);pointer-events:auto;animation:pulse 1.8s ease-in-out 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 50px rgba(255,46,136,1)}}
#dots{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 8px);display:flex;gap:6px;z-index:3}
#dots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.35);transition:all .3s}#dots i.on{width:18px;background:#fff}
/* ---------- personage kiezen ---------- */
#pick{position:fixed;inset:0;z-index:31;display:none;flex-direction:column;overflow:hidden;background:linear-gradient(180deg,#221a4e 0%,#5a2a86 30%,#b2408f 62%,#f08a5d 100%)}
#pick .leaves{position:absolute;inset:0;pointer-events:none;opacity:.35}
#pickHead{position:relative;padding:calc(var(--st) + 16px) 60px 8px;text-align:center}
#pickHead h2{font:800 clamp(13px,3.6vw,18px) Inter,sans-serif;letter-spacing:.7em;color:#d9cff5;padding-left:.7em}
#pickHead p{font:400 clamp(30px,9vw,46px)/1 Anton,Impact,sans-serif;font-style:italic;letter-spacing:2px;color:#fff;text-shadow:3px 3px 0 #1a0a2c;margin-top:6px}
#cards{position:relative;flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;touch-action:pan-x;padding:8px calc(50vw - min(40vw,180px)) 4px}
#cards::-webkit-scrollbar{display:none}
.card{flex:0 0 min(80vw,360px);margin:0 10px;scroll-snap-align:center;display:flex;flex-direction:column;position:relative;transition:transform .35s,opacity .35s;animation:cardIn .9s cubic-bezier(.2,1.3,.4,1) both}
.card:nth-child(1){animation-delay:.05s}.card:nth-child(2){animation-delay:.2s}.card:nth-child(3){animation-delay:.35s}.card:nth-child(4){animation-delay:.5s}
@keyframes cardIn{from{transform:translateX(70vw) skewX(-14deg);opacity:0}to{transform:none;opacity:1}}
.card .art{flex:1;min-height:0;overflow:hidden;position:relative;border:7px solid #1a0a2c;outline:2px solid rgba(255,190,230,.55);outline-offset:-11px;box-shadow:0 14px 40px rgba(20,0,40,.55)}
.card .art svg,.card .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;animation:kb2 6s ease-in-out infinite alternate}
@keyframes kb2{from{transform:scale(1.02)}to{transform:scale(1.09) translateY(-1.5%)}}
.card .art::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,0) 40%,rgba(255,255,255,.28) 50%,rgba(255,255,255,0) 60%);transform:translateX(-120%);animation:shine 3.6s ease-in-out infinite}
@keyframes shine{0%,55%{transform:translateX(-120%)}80%,100%{transform:translateX(120%)}}
.card .nm{position:absolute;left:14px;right:14px;bottom:14px;z-index:2}
.card .nm b{display:block;font:400 clamp(52px,15vw,74px)/0.88 Anton,Impact,sans-serif;font-style:italic;letter-spacing:1px;color:#fff;-webkit-text-stroke:2.5px #1a0a2c;text-shadow:5px 5px 0 var(--c),0 0 24px var(--c);animation:slam .7s cubic-bezier(.2,1.6,.4,1) both;animation-delay:inherit}
@keyframes slam{from{transform:scale(2.2) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
.kies{margin-top:12px;width:100%;font:400 22px Anton,Impact,sans-serif;letter-spacing:3px;padding:12px;border:4px solid #1a0a2c;border-radius:0;color:#1a0629;background:var(--c);box-shadow:5px 5px 0 #1a0a2c;cursor:pointer}
.kies:active{transform:translate(3px,3px);box-shadow:2px 2px 0 #1a0a2c}
#lets{position:fixed;inset:0;z-index:35;display:none;align-items:center;justify-content:center;pointer-events:none;background:radial-gradient(ellipse,rgba(255,46,136,.35),rgba(10,0,25,.85))}
#lets b{font:400 clamp(54px,17vw,130px)/0.9 Anton,Impact,sans-serif;font-style:italic;color:#fff;text-align:center;-webkit-text-stroke:3px #1a0a2c;text-shadow:6px 6px 0 var(--c),0 0 40px var(--c);animation:slam .55s cubic-bezier(.2,1.6,.4,1) both}
#pickNav{display:flex;justify-content:center;align-items:center;gap:14px;padding:12px 0 calc(var(--sb) + 14px)}
#pickNav button{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;font-size:20px;cursor:pointer}
#pickDots{display:flex;gap:6px}#pickDots i{width:8px;height:8px;border-radius:4px;background:rgba(255,255,255,.3);transition:all .3s}#pickDots i.on{width:22px;background:#ff2e88}
/* ---------- geluid ---------- */
#snd{position:fixed;left:50%;top:calc(var(--st) + 14px);transform:translateX(-50%);z-index:40;display:none;align-items:center;gap:6px;background:rgba(255,46,136,.9);color:#fff;font:800 14px Inter,sans-serif;padding:10px 18px;border-radius:24px;box-shadow:0 0 20px rgba(255,46,136,.6);animation:blink 1.4s infinite;cursor:pointer}
@keyframes blink{50%{opacity:.35}}
#mus{position:fixed;top:calc(var(--st) + 10px);right:calc(var(--sr) + 10px);z-index:41;width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.35);background:rgba(10,4,24,.55);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(4px)}
#mus svg{width:22px;height:22px}
/* ---------- bediening in het spel ---------- */
#touch{position:fixed;inset:0;z-index:10;display:none;pointer-events:none}
#joyZone{position:absolute;left:0;top:28%;bottom:0;width:58%;pointer-events:auto;touch-action:none}
#joyBase{position:absolute;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:rgba(255,255,255,.08);display:none}
#joyKnob{position:absolute;left:40px;top:40px;width:52px;height:52px;border-radius:50%;background:rgba(255,209,102,.9);box-shadow:0 0 14px rgba(255,140,60,.7)}
#joyHint{position:absolute;left:calc(var(--sl) + 26px);bottom:calc(var(--sb) + 34px);width:118px;height:118px;border-radius:50%;border:2px dashed rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font:700 11px Inter,sans-serif;color:rgba(255,255,255,.6);text-align:center;pointer-events:none}
.tb{position:absolute;pointer-events:auto;border-radius:50%;border:2px solid rgba(255,255,255,.45);background:rgba(10,10,20,.45);color:#fff;font:900 12px Inter,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;letter-spacing:.5px;line-height:1.15;backdrop-filter:blur(3px)}
.tb:active,.tb.on{background:rgba(255,46,136,.6)}
#bAct{right:calc(var(--sr) + 20px);bottom:calc(var(--sb) + 30px);width:96px;height:96px;font-size:14px;background:rgba(0,150,255,.42)}
#bJump{right:calc(var(--sr) + 34px);bottom:calc(var(--sb) + 138px);width:68px;height:68px;font-size:11px;background:rgba(120,255,160,.32)}
#bCar{right:calc(var(--sr) + 126px);bottom:calc(var(--sb) + 22px);width:72px;height:72px;background:rgba(255,190,40,.45);display:none}
#sideBtns{position:fixed;z-index:11;display:none;gap:8px;flex-direction:column;right:calc(var(--sr) + 10px)}
#topBtns{position:fixed;z-index:11;display:none;gap:8px;top:calc(var(--st) + 10px);right:calc(var(--sr) + 58px)}
.sb{pointer-events:auto;width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.35);background:rgba(10,4,24,.55);color:#fff;font:700 18px Inter,sans-serif;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(4px)}
.sb:active{background:rgba(255,46,136,.6)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="intro">
  <div id="slides"></div>
  <img id="introLogo" src="assets/logo.png" alt="GTB Bommel">
  <div id="loadBox"><div id="loadTip"></div><div id="loadRow"><div id="loadSpin"></div><div id="loadBar"><div id="loadFill"></div></div><div id="loadPct">0%</div></div></div>
  <button id="play">SPELEN</button>
  <div id="dots"></div>
</div>
<div id="pick">
  <svg class="leaves" viewBox="0 0 400 800" preserveAspectRatio="none"><g fill="#1a0a2c"><path d="M-20 80 C60 120 90 60 160 90 C100 100 60 140 -20 150Z M-20 200 C40 220 70 180 120 210 C70 215 30 250 -20 260Z M420 620 C340 600 310 660 240 640 C300 620 340 580 420 560Z M420 720 C350 700 320 760 250 740 C310 730 350 690 420 680Z M420 120 C360 140 340 100 280 130 C330 135 370 170 420 180Z M-20 640 C50 650 80 610 140 640 C80 650 40 690 -20 700Z"/></g></svg><div id="pickHead"><p>WIE GAAT ER BOMMEL IN?</p></div>
  <div id="cards"></div>
  <div id="pickNav"><button id="pPrev" aria-label="Vorige">‹</button><div id="pickDots"></div><button id="pNext" aria-label="Volgende">›</button></div>
</div>
<div id="lets"><b id="letsT"></b></div>
<div id="snd">🔊 Tik voor geluid</div>
<div id="mus" aria-label="Muziek aan/uit"></div>
<div id="touch">
  <div id="joyZone"><div id="joyBase"><div id="joyKnob"></div></div></div>
  <div id="joyHint">sleep hier<br>om te lopen<br>&amp; sturen</div>
  <div class="tb" id="bCar">IN<br>STAP</div>
  <div class="tb" id="bAct">💧<br>GOOI</div>
  <div class="tb" id="bJump">⤒<br>SPRING</div>
</div>
<div id="topBtns"><div class="sb" id="bPause">❚❚</div><div class="sb" id="bRestart">⟲</div></div>
<div id="sideBtns"><div class="sb" id="bMap">🗺</div></div>
<script type="application/json" id="wdata">__WORLD__</script>
<script>
'use strict';
// ====================== basis ======================
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const IS_TOUCH=('ontouchstart' in window)||navigator.maxTouchPoints>0;
let CW=800,CH=600,DPR=1;
function resize(){DPR=Math.min(window.devicePixelRatio||1,IS_TOUCH?2:2);CW=window.innerWidth;CH=window.innerHeight;cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);cv.style.width=CW+'px';cv.style.height=CH+'px';placeTopBtns();}
window.addEventListener('resize',resize);
const TAU=Math.PI*2,clamp=(v,a,b)=>v<a?a:v>b?b:v,wrap=a=>{while(a>Math.PI)a-=TAU;while(a<-Math.PI)a+=TAU;return a;};
const rr=(a,b)=>a+Math.random()*(b-a),rpick=a=>a[Math.random()*a.length|0];
let seed=1988;function rnd(){seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
const R=(a,b)=>a+rnd()*(b-a),RP=a=>a[Math.floor(rnd()*a.length)];
function shade(hex,f){const n=parseInt(hex.slice(1),16);return `rgb(${Math.min(255,((n>>16)&255)*f)|0},${Math.min(255,((n>>8)&255)*f)|0},${Math.min(255,(n&255)*f)|0})`;}
const hsh=(x,y)=>(((x*73856093)^(y*19349663))>>>0);
function pip(x,y,p){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const a=p[i],b=p[j];if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])c=!c;}return c;}
function bbox(p){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const q of p){if(q[0]<x0)x0=q[0];if(q[1]<y0)y0=q[1];if(q[0]>x1)x1=q[0];if(q[1]>y1)y1=q[1];}return[x0,y0,x1,y1];}
const lsGet=k=>{try{return localStorage.getItem(k);}catch(e){return null;}},lsSet=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};

// ====================== audio (80s synthwave, zelf gegenereerd) ======================
const AU={c:null,on:lsGet('gtb6music')!=='0',timer:null,step:0,nextT:0};
const BPM=104,SPB=60/BPM/4,mf=m=>440*Math.pow(2,(m-69)/12);
const PROG=[{r:45,n:[57,60,64]},{r:41,n:[53,57,60]},{r:48,n:[55,60,64]},{r:43,n:[55,59,62]}];
const MEL=[[0,0,76,4],[0,4,74,2],[0,6,72,2],[0,8,71,4],[0,12,72,4],[1,0,72,6],[1,6,69,2],[1,8,72,4],[1,12,74,4],[2,0,76,4],[2,4,79,4],[2,8,76,4],[2,12,74,4],[3,0,74,8],[3,8,71,4],[3,12,67,4],
 [4,0,76,4],[4,4,74,2],[4,6,72,2],[4,8,71,4],[4,12,69,4],[5,0,72,4],[5,4,77,4],[5,8,76,4],[5,12,72,4],[6,0,79,6],[6,6,76,2],[6,8,72,4],[6,12,76,4],[7,0,74,12],[7,12,71,4]];
function auInit(){
  if(AU.c)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  try{
  const c=new AC();AU.c=c;
  const comp=c.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=4;comp.connect(c.destination);
  AU.master=c.createGain();AU.master.gain.value=.85;AU.master.connect(comp);
  AU.mus=c.createGain();AU.mus.gain.value=AU.on?.5:0;AU.mus.connect(AU.master);
  AU.sfx=c.createGain();AU.sfx.gain.value=.8;AU.sfx.connect(AU.master);
  const d=c.createDelay(1);d.delayTime.value=SPB*3;const fb=c.createGain();fb.gain.value=.33;const dl=c.createBiquadFilter();dl.type='lowpass';dl.frequency.value=2400;d.connect(dl);dl.connect(fb);fb.connect(d);const dg=c.createGain();dg.gain.value=.55;dl.connect(dg);dg.connect(AU.mus);AU.del=d;
  const len=c.sampleRate*2|0,ib=c.createBuffer(2,len,c.sampleRate);for(let k=0;k<2;k++){const a=ib.getChannelData(k);for(let i=0;i<len;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6);}
  const cvb=c.createConvolver();cvb.buffer=ib;const rg=c.createGain();rg.gain.value=.4;cvb.connect(rg);rg.connect(AU.mus);AU.rev=cvb;
  const nb=c.createBuffer(1,c.sampleRate,c.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;AU.noise=nb;
  // motor
  const curve=new Float32Array(1024);for(let i=0;i<1024;i++){const x=i/512-1;curve[i]=(1+3)*x/(1+3*Math.abs(x));}
  const eo=c.createOscillator();eo.type='sawtooth';eo.frequency.value=40;const eo2=c.createOscillator();eo2.type='square';eo2.frequency.value=20;const e2g=c.createGain();e2g.gain.value=.55;
  const ws=c.createWaveShaper();ws.curve=curve;const ef=c.createBiquadFilter();ef.type='lowpass';ef.frequency.value=500;ef.Q.value=3;const eg=c.createGain();eg.gain.value=0;
  eo.connect(ws);eo2.connect(e2g);e2g.connect(ws);ws.connect(ef);ef.connect(eg);eg.connect(AU.sfx);eo.start();eo2.start();AU.eo=eo;AU.eo2=eo2;AU.ef=ef;AU.eg=eg;
  const wo=c.createOscillator();wo.type='triangle';wo.frequency.value=220;const wg=c.createGain();wg.gain.value=0;wo.connect(wg);wg.connect(AU.sfx);wo.start();AU.wo=wo;AU.wg=wg;
  const tb=c.createBufferSource();tb.buffer=AU.noise;tb.loop=true;const tbf=c.createBiquadFilter();tbf.type='lowpass';tbf.frequency.value=240;const tbg=c.createGain();tbg.gain.value=0;tb.connect(tbf);tbf.connect(tbg);tbg.connect(AU.sfx);tb.start();AU.tbg=tbg;
  const wl=c.createBufferSource();wl.buffer=AU.noise;wl.loop=true;const wlf=c.createBiquadFilter();wlf.type='bandpass';wlf.frequency.value=480;wlf.Q.value=.6;const wlg=c.createGain();wlg.gain.value=0;wl.connect(wlf);wlf.connect(wlg);wlg.connect(AU.sfx);wl.start(0,.5);AU.wlg=wlg;
  const sk=c.createBufferSource();sk.buffer=AU.noise;sk.loop=true;const sbf=c.createBiquadFilter();sbf.type='bandpass';sbf.frequency.value=2400;sbf.Q.value=5;const skg=c.createGain();skg.gain.value=0;sk.connect(sbf);sbf.connect(skg);skg.connect(AU.sfx);sk.start();AU.sbf=sbf;AU.skg=skg;
  // sirene
  const so=c.createOscillator();so.type='square';so.frequency.value=760;const lfo=c.createOscillator();lfo.type='square';lfo.frequency.value=1.4;const lg=c.createGain();lg.gain.value=170;lfo.connect(lg);lg.connect(so.frequency);const sf=c.createBiquadFilter();sf.type='lowpass';sf.frequency.value=1600;const sg=c.createGain();sg.gain.value=0;so.connect(sf);sf.connect(sg);sg.connect(AU.sfx);so.start();lfo.start();AU.sg=sg;
  }catch(e){AU.c=null;}
}
function env(g,t,a,peak,hold,rel){g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.setValueAtTime(peak,t+a+hold);g.gain.exponentialRampToValueAtTime(.0001,t+a+hold+rel);}

function nearestRoadDir(x,y){let bd=1e18,ang=0;for(const r of ROADS){if(x<r.bb[0]-300||x>r.bb[2]+300||y<r.bb[1]-300||y>r.bb[3]+300)continue;for(let i=0;i<r.p.length-1;i++){const a=r.p[i],b=r.p[i+1],dx=b[0]-a[0],dy=b[1]-a[1],L2=dx*dx+dy*dy||1;let t=((x-a[0])*dx+(y-a[1])*dy)/L2;t=clamp(t,0,1);const qx=a[0]+dx*t-x,qy=a[1]+dy*t-y,d=qx*qx+qy*qy;if(d<bd){bd=d;ang=Math.atan2(dy,dx);}}}return ang;}

const NODES=[],EDGES=[];
function buildGraph(){
  const map=new Map(),NPC={tertiary:1,residential:1,unclassified:1,living_street:1};
  const node=(k,x,y)=>{let id=k?map.get(k):undefined;if(id===undefined){id=NODES.length;NODES.push({x,y,adj:[]});if(k)map.set(k,id);}return id;};
  ROADS.forEach((r,ri)=>{if(!NPC[r.k])return;let prev=-1;
    r.p.forEach((q,i)=>{const id=node(r.j[i]?'j'+r.j[i]:null,q[0],q[1]);if(prev>=0&&prev!==id){const A=NODES[prev],B=NODES[id],len=Math.hypot(B.x-A.x,B.y-A.y);if(len>2){EDGES.push({a:prev,b:id,len,w:r.w,n:r.n,spd:r.k==='tertiary'?3.8:r.fort?2.5:3.1});A.adj.push(EDGES.length-1);B.adj.push(EDGES.length-1);}}prev=id;});});
}
function nearestEdge(x,y){let best=null,bd=1e18;for(let i=0;i<EDGES.length;i++){const e=EDGES[i],A=NODES[e.a],B=NODES[e.b];if(Math.abs(A.x-x)>900&&Math.abs(B.x-x)>900)continue;const dx=B.x-A.x,dy=B.y-A.y;let t=((x-A.x)*dx+(y-A.y)*dy)/(e.len*e.len);t=clamp(t,0,1);const qx=A.x+dx*t-x,qy=A.y+dy*t-y,d=qx*qx+qy*qy;if(d<bd){bd=d;best={ei:i,t,d:Math.sqrt(d)};}}
  if(!best){for(let i=0;i<EDGES.length;i++){const e=EDGES[i],A=NODES[e.a],d=Math.hypot(A.x-x,A.y-y);if(d<bd){bd=d;best={ei:i,t:0,d};}}}return best;}
function dijkstra(s,g){const n=NODES.length,dist=new Float64Array(n).fill(Infinity),prev=new Int32Array(n).fill(-1),h=[[0,s]];dist[s]=0;
  while(h.length){let bi=0;for(let i=1;i<h.length;i++)if(h[i][0]<h[bi][0])bi=i;const [d,u]=h[bi];h[bi]=h[h.length-1];h.pop();if(d>dist[u])continue;if(u===g)break;
    for(const ei of NODES[u].adj){const e=EDGES[ei],v=e.a===u?e.b:e.a,nd=d+e.len;if(nd<dist[v]){dist[v]=nd;prev[v]=u;h.push([nd,v]);}}}
  const path=[];let c=g;while(c>=0){path.unshift(c);if(c===s)break;c=prev[c];}return path[0]===s?path:[g];}

function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open('gtb6',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}});}
async function idbGet(k){const db=await idb();return new Promise(res=>{try{const q=db.transaction('f').objectStore('f').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null);}catch(e){res(null);}});}
async function idbPut(k,v){const db=await idb();return new Promise(res=>{try{const q=db.transaction('f','readwrite').objectStore('f').put(v,k);q.onsuccess=()=>res(true);q.onerror=()=>res(false);}catch(e){res(false);}});}

function buildPick(){const cards=document.getElementById('cards'),dots=document.getElementById('pickDots');cards.innerHTML='';dots.innerHTML='';
  CHARS.forEach((ch,i)=>{const el=document.createElement('div');el.className='card';el.style.setProperty('--c',ch.c);
    el.innerHTML=`<div class="art">${portraitSVG(ch,i)}<div class="nm"><b>${ch.name}</b></div></div>
      <button class="kies" data-i="${i}">KIES ${ch.name}</button>`;cards.appendChild(el);const d=document.createElement('i');dots.appendChild(d);});
  cards.querySelectorAll('.kies').forEach(b=>b.addEventListener('click',()=>choose(+b.dataset.i)));
  cards.addEventListener('scroll',updPick,{passive:true});setTimeout(()=>{scrollToCard(0,false);updPick();},30);}
function scrollToCard(i,smooth){const cards=document.getElementById('cards'),el=cards.children[i];if(!el)return;cards.scrollTo({left:el.offsetLeft-(cards.clientWidth-el.clientWidth)/2,behavior:smooth?'smooth':'auto'});}
function updPick(){const cards=document.getElementById('cards'),mid=cards.scrollLeft+cards.clientWidth/2;let best=0,bd=1e9;[...cards.children].forEach((el,i)=>{const d=Math.abs(el.offsetLeft+el.clientWidth/2-mid);if(d<bd){bd=d;best=i;}const k=clamp(1-d/(el.clientWidth*1.2),0,1);el.style.transform=`scale(${.9+.1*k})`;el.style.opacity=.55+.45*k;});
  pickIdx=best;[...document.querySelectorAll('#pickDots i')].forEach((d,i)=>d.classList.toggle('on',i===best));}
let autoIv=null;
function showPick(){if(MODE!=='intro'||!loadDone)return;MODE='pick';document.getElementById('pick').style.display='flex';buildPick();clearInterval(autoIv);let k=0;
  autoIv=setInterval(()=>{if(MODE!=='pick'){clearInterval(autoIv);return;}k=(k+1)%CHARS.length;scrollToCard(k,true);},2600);
  const stop=()=>{clearInterval(autoIv);};const cards=document.getElementById('cards');['pointerdown','touchstart','wheel'].forEach(ev=>cards.addEventListener(ev,stop,{once:true,passive:true}));
  ['pPrev','pNext'].forEach(id=>document.getElementById(id).addEventListener('click',stop,{once:true}));}
const LINES={vince:'Tijd voor actie.',joey:"Yeah, let's go!",lola:'Bommel, hier kom ik!',roxy:"Let's go, schatjes!"};
function speak(txt,ch){try{const ss=window.speechSynthesis;if(!ss)return;ss.cancel();const u=new SpeechSynthesisUtterance(txt);const vs=ss.getVoices();const fem=ch.id==='lola'||ch.id==='roxy';
  const nl=vs.filter(v=>/^nl/i.test(v.lang));const en=vs.filter(v=>/^en/i.test(v.lang));const pool=/[a-z]'s|yeah|let's/i.test(txt)&&en.length?en:(nl.length?nl:vs);
  const pref=pool.find(v=>fem?/female|vrouw|ellen|claire|fenna|colette|zira|samantha|karen/i.test(v.name):/male|man|xander|maarten|daniel|david|alex/i.test(v.name))||pool[0];if(pref){u.voice=pref;u.lang=pref.lang;}
  u.pitch=fem?1.15:.75;u.rate=1.02;u.volume=1;ss.speak(u);}catch(e){}}
let chosen=false;
function choose(i){if(chosen)return;chosen=true;clearInterval(autoIv);const ch=CHARS[i];P.ch=ch;P.maxhp=100;P.hp=P.maxhp;const line=LINES[ch.id]||"Yeah, let's go!";
  const L2=document.getElementById('lets'),T2=document.getElementById('letsT');L2.style.setProperty('--c',ch.c);T2.style.setProperty('--c',ch.c);T2.textContent=line.toUpperCase();L2.style.display='flex';T2.style.animation='none';void T2.offsetWidth;T2.style.animation='';
  speak(line,ch);sfx('sting');setTimeout(()=>{L2.style.display='none';chosen=false;document.getElementById('pick').style.display='none';document.getElementById('intro').style.display='none';clearInterval(slideTimer);startPlay();},1700);}
if(window.speechSynthesis){try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();}catch(e){}}
document.getElementById('pPrev').addEventListener('click',()=>scrollToCard(Math.max(0,pickIdx-1),true));
document.getElementById('pNext').addEventListener('click',()=>scrollToCard(Math.min(CHARS.length-1,pickIdx+1),true));
// ====================== muziek altijd aan bij start ======================
let NEED_TAP=false;
const ICON_ON='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3" fill="#fff"/><circle cx="18" cy="16" r="3" fill="#fff"/></svg>';
const ICON_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z" fill="#fff"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>';
function updMusIcon(){document.getElementById('mus').innerHTML=AU.on?ICON_ON:ICON_OFF;}
function startMusicNow(){try{auInit();}catch(e){}radio.volume=MODE==='play'?.45:.9;if(!AU.on)return;let pr=null;try{pr=radio.play();}catch(e){}
  const blocked=()=>{NEED_TAP=true;document.getElementById('snd').style.display='flex';};if(pr&&pr.then)pr.then(()=>{if(AU.c&&AU.c.state==='suspended')AU.c.resume();}).catch(blocked);else blocked();}
function unlockSound(e){if(!NEED_TAP)return;NEED_TAP=false;document.getElementById('snd').style.display='none';try{auInit();if(AU.c&&AU.c.state==='suspended')AU.c.resume();}catch(_){}musicPlay(false);}
['pointerup','touchend','click','keydown'].forEach(ev=>window.addEventListener(ev,unlockSound,true));
document.getElementById('mus').addEventListener('click',e=>{e.stopPropagation();if(NEED_TAP)return;musicToggle();});
function enterIntro(fast){MODE='intro';document.getElementById('intro').style.display='block';document.getElementById('pick').style.display='none';document.getElementById('touch').style.display='none';
  document.getElementById('topBtns').style.display='none';document.getElementById('sideBtns').style.display='none';setupIntro();runLoader(fast);}
function restartGame(){paused=false;bigMap=false;P.stats={nat:0,omver:0,gejat:0};cars=[];peds=[];balloons=[];parts=[];decals=[];bubbles=[];msgs.length=0;P.dead=0;P.jz=0;respawn();camZ=1.15;populate();initMission();P.money=0;FX=[];SKIDS=[];hitStop=0;if(MG.on)mgEnd();
  document.getElementById('bPause').textContent='❚❚';radio.volume=.9;enterIntro(true);}
let restartArm=0;function askRestart(){if(performance.now()-restartArm<2500){restartArm=0;restartGame();}else{restartArm=performance.now();msg('OPNIEUW BEGINNEN?','Tik nog een keer op ⟲','#ffd166',140);}}
function startPlay(){MODE='play';radio.volume=.45;musicPlay();
  if(IS_TOUCH){document.getElementById('touch').style.display='block';const de=document.documentElement;try{const r=(de.requestFullscreen||de.webkitRequestFullscreen);if(r){const pr=r.call(de);if(pr&&pr.catch)pr.catch(()=>{});}}catch(e){}}
  document.getElementById('topBtns').style.display='flex';document.getElementById('sideBtns').style.display='flex';placeTopBtns();msg(P.ch?P.ch.name+' IN BOMMEL':'WELKOM IN BOMMEL','Missie 1: breng een bezoek aan de Sint-Maartenskerk','#ffd166',240);last=performance.now();}
document.getElementById('play').addEventListener('click',showPick);
// ====================== touch-bediening ======================
function placeTopBtns(){const sb=document.getElementById('sideBtns');if(!sb)return;const S=Math.round(clamp(Math.min(CW,CH)*.28,100,180)),top=uiTop().bottom+8+S+12;sb.style.top=top+'px';sb.style.flexDirection=(CH-top<260)?'row':'column';}
function buzz(ms){if(Array.isArray(ms)){try{if(IS_TOUCH&&navigator.vibrate)navigator.vibrate(ms);}catch(e){}return;}try{if(IS_TOUCH&&navigator.vibrate)navigator.vibrate(ms);}catch(e){}}
function updTouchUI(){document.getElementById('bJump').style.display=P.car||P.dead||swimming()?'none':'flex';const bA=document.getElementById('bAct'),bC=document.getElementById('bCar');const ac=P.car?'REM':'💧<br>GOOI';if(bA._t!==ac){bA.innerHTML=ac;bA._t=ac;}
  const show=!!P.car||!!carNear(),ct=P.car?'UIT<br>STAP':'IN<br>STAP';bC.style.display=show&&!P.dead?'flex':'none';if(bC._t!==ct){bC.innerHTML=ct;bC._t=ct;}}
function setupZoom(){cv.addEventListener('wheel',e=>{if(MODE!=='play')return;e.preventDefault();setZoom(ZU*(e.deltaY>0?.9:1.11));},{passive:false});
  const pts=new Map();let d0=0,z0=1;
  cv.addEventListener('pointerdown',e=>{pts.set(e.pointerId,[e.clientX,e.clientY]);if(pts.size===2){const [a,b]=[...pts.values()];d0=Math.hypot(a[0]-b[0],a[1]-b[1]);z0=ZU;}});
  cv.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,[e.clientX,e.clientY]);if(pts.size===2&&d0>0){const [a,b]=[...pts.values()];setZoom(z0*Math.hypot(a[0]-b[0],a[1]-b[1])/d0);}});
  const up=e=>{pts.delete(e.pointerId);if(pts.size<2)d0=0;};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  const hold=(id,f)=>{const el=document.getElementById(id);let iv=null;el.addEventListener('pointerdown',e=>{e.preventDefault();f();clearInterval(iv);iv=setInterval(f,120);});['pointerup','pointerleave','pointercancel'].forEach(t=>el.addEventListener(t,()=>{clearInterval(iv);}));};
  document.getElementById('bRestart').addEventListener('pointerdown',e=>{e.preventDefault();askRestart();});}
function setupMapClick(){const mgp=e=>{if(MG.on&&!MG.res&&(e.pointerType==='mouse'||e.buttons||e.type==='pointerdown')){const B=mgBox();MG.hy=clamp(e.clientY,B.top+10,B.bot-10);}};cv.addEventListener('pointerdown',mgp);cv.addEventListener('pointermove',mgp);
  cv.addEventListener('pointerdown',e=>{if(MODE!=='play'||MG.on)return;if(bigMap){bigMap=false;return;}if(Math.hypot(e.clientX-MM.x,e.clientY-MM.y)<=MM.r+4)bigMap=true;});
  cv.addEventListener('pointermove',e=>{if(MODE==='play')cv.style.cursor=(bigMap||Math.hypot(e.clientX-MM.x,e.clientY-MM.y)<=MM.r)?'pointer':'default';});}
function setupTouch(){
  const zone=document.getElementById('joyZone'),base=document.getElementById('joyBase'),knob=document.getElementById('joyKnob'),hint=document.getElementById('joyHint');let jid=null,bx=0,by=0;
  touch.on=IS_TOUCH;
  zone.addEventListener('pointerdown',e=>{if(jid!==null)return;jid=e.pointerId;try{zone.setPointerCapture(jid);}catch(_){}bx=e.clientX;by=e.clientY;base.style.display='block';base.style.left=bx+'px';base.style.top=(by-zone.getBoundingClientRect().top)+'px';hint.style.display='none';e.preventDefault();});
  const zt=()=>zone.getBoundingClientRect().top;
  zone.addEventListener('pointermove',e=>{if(e.pointerId!==jid)return;let dx=e.clientX-bx,dy=e.clientY-by,d=Math.hypot(dx,dy);const m=58;
    if(d>m*1.25){const k=(d-m*1.25)/d;bx+=dx*k;by+=dy*k;base.style.left=bx+'px';base.style.top=(by-zt())+'px';dx=e.clientX-bx;dy=e.clientY-by;d=Math.hypot(dx,dy);}
    let kx=dx,ky=dy;if(d>m){kx*=m/d;ky*=m/d;}knob.style.left=(40+kx)+'px';knob.style.top=(40+ky)+'px';
    const n=Math.min(1,d/m),dz=.14,v=n<dz?0:Math.pow((n-dz)/(1-dz),1.15);touch.jx=d>0?dx/d*v:0;touch.jy=d>0?dy/d*v:0;e.preventDefault();});
  const end=e=>{if(e.pointerId!==jid)return;jid=null;touch.jx=touch.jy=0;base.style.display='none';knob.style.left='40px';knob.style.top='40px';};
  zone.addEventListener('pointerup',end);zone.addEventListener('pointercancel',end);
  const bA=document.getElementById('bAct');bA.addEventListener('pointerdown',e=>{e.preventDefault();touch.act=true;bA.classList.add('on');});['pointerup','pointercancel','pointerleave'].forEach(t=>bA.addEventListener(t,()=>{touch.act=false;bA.classList.remove('on');}));
  document.getElementById('bCar').addEventListener('pointerdown',e=>{e.preventDefault();touch.enter=true;buzz(15);});
  const bJ=document.getElementById('bJump');bJ.addEventListener('pointerdown',e=>{e.preventDefault();touch.jump=true;bJ.classList.add('on');buzz(12);});['pointerup','pointercancel','pointerleave'].forEach(t=>bJ.addEventListener(t,()=>bJ.classList.remove('on')));
  document.getElementById('bMap').addEventListener('pointerdown',e=>{e.preventDefault();bigMap=!bigMap;});
  document.getElementById('bPause').addEventListener('pointerdown',e=>{e.preventDefault();paused=!paused;document.getElementById('bPause').textContent=paused?'▶':'❚❚';});
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&MODE==='play'){paused=true;document.getElementById('bPause').textContent='▶';}if(AU.c){if(document.hidden)AU.c.suspend();else AU.c.resume();}});
}

// ====================== start ======================
function populate(){const v=parkNear(P.x+30,P.y+30,'velzart');v.keep=0;for(let i=0;i<22;i++)spawnCivCar(true);for(let i=0;i<40;i++)spawnPed(true);}
function init(){
  resize();genWorld();buildGraph();buildMini();buildVectorMap();buildPats();initBarges();
  const mk=ROADS.find(r=>r.n==='Markt');SPAWN=mk?mk.p[mk.p.length>>1]:[W/2,H/2];respawn();camZ=1.15;
  populate();initMission();
  setupTouch();setupMapClick();setupZoom();
}
init();
let last=performance.now(),acc=0;
function frame(now){requestAnimationFrame(frame);const dt=Math.min(100,now-last);last=now;
  if(MODE==='play'){if(!paused&&!bigMap){acc+=dt;let n=0;while(acc>=16.667&&n<4){if(MG.on)mgStep();else if(hitStop>0){hitStop--;frameN++;}else step();acc-=16.667;n++;}if(n>=4)acc=0;}renderWorld();}
}
requestAnimationFrame(frame);
updMusIcon();enterIntro(false);startMusicNow();
if(document.fonts&&document.fonts.load){document.fonts.load('40px Anton').catch(()=>{});}
</script>
